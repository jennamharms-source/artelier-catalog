name: Build Commons artist catalog

# Rebuilds catalog/commons/<artist>.json from Wikidata + Wikimedia Commons for every
# config in artists/. Only Public domain / CC0 files are kept. Runs monthly and on demand.
on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build per-artist catalogs
        run: |
          echo '[]' > /tmp/empty_db.json
          for cfg in artists/*.json; do
            name=$(basename "$cfg" .json)
            case "$name" in
              *_category)
                slug=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['slug'])" "$cfg")
                (cd /tmp && python "$GITHUB_WORKSPACE/scripts/commons_category.py" "$GITHUB_WORKSPACE/$cfg" /tmp/empty_db.json) \
                  && python scripts/category_to_catalog.py "/tmp/${slug}_cat.json" "catalog/commons/${name}.json" || echo "::warning::$name failed"
                ;;
              *)
                python scripts/commons_sync.py catalog "$cfg" "catalog/commons/${name}.json" || echo "::warning::$name failed"
                ;;
            esac
          done
          python scripts/build_commons_index.py
      - name: Commit
        run: |
          git config user.name "artelier-catalog-bot"
          git config user.email "artelier-catalog-bot@users.noreply.github.com"
          git add catalog/commons
          git diff --cached --quiet || git commit -m "Rebuild Commons artist catalog ($(date -u +%Y-%m-%d))"
          git push
